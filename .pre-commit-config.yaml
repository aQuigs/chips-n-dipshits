exclude: '^\.claude/worktrees/'
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-case-conflict
      # tsconfig files allow comments
      - id: check-json
        exclude: '(^|/)tsconfig(\.[a-z]+)?\.json$'
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: check-executables-have-shebangs
      - id: check-symlinks
      - id: check-yaml

      - id: destroyed-symlinks
      - id: detect-private-key

      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
      - id: check-added-large-files
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
      # The hook above scans only staged changes, which CI has none of; this scans the repo there
      - id: gitleaks
        alias: gitleaks-repo
        name: Detect hardcoded secrets in the whole repo
        entry: gitleaks git --redact
        pass_filenames: false
        stages: [manual]
  - repo: local
    hooks:
      - id: check-markdown
        name: check-markdown
        entry: markdownlint -c ./.markdownlintrc --ignore .claude --ignore node_modules
        language: system
        files: \.(md|mdown|markdown)$
      # Any change can break the build or the tests, so these run on every commit; CI leaves them to web_ci
      - id: build
        name: Typecheck and build
        entry: npm run build
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: test
        name: Run the tests
        entry: npm test
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
